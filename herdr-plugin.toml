id = "johntrandall.claude-account-watch"
name = "Claude Account Watch"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Flag Claude Code panes that are logged out or have hit a usage limit; herdr otherwise shows them as plain idle."
platforms = ["linux", "macos"]

# Spawns the background sweeper once herdr's socket is ready. The sweeper
# re-reads every Claude pane on an interval (default 60 s) and exits on SIGTERM.
[[startup]]
command = ["python3", "claude_account_watch.py", "start"]

# No [[events]] hook on purpose: `pane.agent_status_changed` fires on every
# turn of every pane, and each run is a fresh python3 process -- measured at
# 0.5-5 s each across ~120 panes on a loaded Mac. The sweep catches a banner
# within one interval, which is enough for this alert. The `event` entrypoint
# still exists if you want to opt back in:
#   [[events]]
#   on = "pane.agent_status_changed"
#   command = ["python3", "claude_account_watch.py", "event"]

[[actions]]
id = "sweep"
title = "Claude Account Watch: sweep now"
contexts = ["workspace", "pane"]
command = ["python3", "claude_account_watch.py", "sweep"]

[[actions]]
id = "status"
title = "Claude Account Watch: status + incidents"
contexts = ["workspace", "pane"]
command = ["python3", "claude_account_watch.py", "status"]

[[actions]]
id = "start"
title = "Claude Account Watch: start sweeper"
contexts = ["workspace"]
command = ["python3", "claude_account_watch.py", "start"]

[[actions]]
id = "stop"
title = "Claude Account Watch: stop sweeper"
contexts = ["workspace"]
command = ["python3", "claude_account_watch.py", "stop"]

[[panes]]
id = "log"
title = "Claude Account Watch log"
placement = "popup"
width = "80%"
height = 24
command = ["python3", "claude_account_watch.py", "log"]
